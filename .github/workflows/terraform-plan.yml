
name: shared matrix
on:
  push:
  workflow_dispatch:

jobs:
  define-matrix:
    runs-on: ubuntu-22.04

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: define targets
        id: targets
        run: |
          echo 'targets=["dev", "ci", "test", "sit"]' >> "$GITHUB_OUTPUT"

  terraform-plan:
    runs-on: ubuntu-22.04
    needs: define-matrix
    strategy:
      matrix:
        target: ${{ fromJSON(needs.define-matrix.outputs.targets) }}

    steps:
      - name: terraform setup
        run: |
          terraform init
          terraform workspace select -or-create ${{ matrix.target }}
          terraform workspace list
      - name: terraform plan
        run: |
          echo "terraform plan"

  terraform-apply:
    runs-on: ubuntu-22.04
    needs:
    - define-matrix
    - terraform-plan
    strategy:
      matrix:
        target: ${{ fromJSON(needs.define-matrix.outputs.targets) }}

    steps:
    - name: terraform apply
      run: |
        echo "terraform apply ${{ matrix.target}}"
