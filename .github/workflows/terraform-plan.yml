
name: shared matrix
on:
  push:
  workflow_dispatch:

jobs:
  define-matrix:
    runs-on: ubuntu-22.04

    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      layers: ${{ steps.layers.outputs.layers }}

    steps:
      - name: define targets
        id: targets
        run: |
          echo 'targets=["dev", "ci", "test", "sit"]' >> "$GITHUB_OUTPUT"
      - name: define layers
        id: layers
        run: |
          echo 'layers=["global", "application-core", "databricks-core", "application-service", "databricks-service"]' >> "$GITHUB_OUTPUT"

  tf-plan:
    runs-on: ubuntu-22.04
    needs: define-matrix
    name: "${{ matrix.target }}: ${{ matrix.layer }}"
    strategy:
      matrix:
        target: ${{ fromJSON(needs.define-matrix.outputs.targets) }}
        layer:
          - ${{ (fromJSON(needs.define-matrix.outputs.layers))[0] }}
        include:
          - target: transit
            layer: core

    steps:
      - name: terraform setup
        run: |
          terraform init
          terraform workspace select -or-create ${{ matrix.target }}
          terraform workspace list
      - name: terraform plan
        run: |
          echo "terraform plan"

  tf-apply-core:
    runs-on: ubuntu-22.04
    needs:
    - define-matrix
    - tf-plan
    environment:
      name: development
    strategy:
      max-parallel: 1
      matrix:
        target:
          - transit

    steps:
      - name: terraform apply
        run: |
          echo "terraform apply ${{ matrix.target }}"
        

  tf-apply-global:
    runs-on: ubuntu-22.04
    needs:
    - define-matrix
    - tf-plan
    - tf-apply-core
    environment:
      name: development
    strategy:
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.define-matrix.outputs.targets) }}
        include:
          - layer: global

    steps:
      - name: terraform apply
        run: |
          echo "terraform apply ${{ matrix.target }}"


